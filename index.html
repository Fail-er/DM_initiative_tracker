<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM Encounter Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="icon-rail" aria-label="Navigace">
    <div class="icon-rail-logo" title="DM Encounter Tracker">⚔️</div>
    <button id="undo-btn" class="icon-rail-btn" type="button" title="Vrátit poslední akci (Ctrl+Z)"><img src="assets/icons/icon-undo.png" alt="Undo" /></button>
    <button id="combat-log-btn" class="icon-rail-btn" type="button" title="Otevřít Combat Log"><img src="assets/icons/icon-combat-log.png" alt="Combat Log" /></button>
    <button id="backup-btn" class="icon-rail-btn" type="button" title="Stáhnout zálohu všech dat (monstra, hráči, kouzla, encounter, log)"><img src="assets/icons/icon-backup.png" alt="Backup" /></button>
    <button id="restore-btn" class="icon-rail-btn" type="button" title="Obnovit ze zálohy"><img src="assets/icons/icon-restore.png" alt="Restore" /></button>
    <input id="restore-input" type="file" accept=".json,application/json" hidden />
    <button id="player-view-btn" class="icon-rail-btn" type="button" title="Otevřít Player View v novém okně (pro OBS)"><img src="assets/icons/icon-player-view.png" alt="Player View" /></button>
  </nav>

  <div class="app-main-column">

  <header class="app-header">
    <h1 class="app-title">DM Encounter Tracker</h1>

    <div class="spellbook-search-container">
      <div class="spellbook-search-row">
        <div class="spellbook-search-input-wrap">
          <span class="spellbook-search-icon" aria-hidden="true"><img src="assets/icons/icon-search.png" alt="" /></span>
          <input
            id="spellbook-search-input"
            class="spellbook-search-input"
            type="text"
            placeholder="Spellbook"
            autocomplete="off"
            aria-label="Vyhledat kouzlo"
          />
          <button id="spellbook-search-clear-btn" class="spellbook-search-clear-btn" type="button" aria-label="Vymazat vyhledávání" style="display:none">&times;</button>
        </div>
        <button id="spellbook-import-btn" class="btn btn-small btn-icon" type="button" title="Import Spells JSON"><img src="assets/icons/icon-import-spells.png" alt="Import Spells" /></button>
        <input id="spellbook-import-input" type="file" accept=".json,application/json" hidden />
      </div>
      <div id="spellbook-results" class="spellbook-results" style="display:none"></div>
    </div>

    <div class="header-shortcuts">
      <span><kbd>/</kbd> hledat</span>
      <span><kbd>Alt+S</kbd> spellbook</span>
      <span><kbd>N</kbd> další monstrum</span>
      <span><kbd>B</kbd> předchozí tah</span>
      <span><kbd>K</kbd> dead</span>
      <span><kbd>Del</kbd> odstranit</span>
      <span><kbd>Ctrl+Z</kbd> undo</span>
      <span><kbd>Esc</kbd> zrušit výběr</span>
    </div>
  </header>

  <main class="app-layout">

    <!-- LEFT COLUMN: library panel + reminders panel stacked, occupying
         the grid's first column together. -->
    <div class="left-column">

    <!-- LEFT PANEL: monster + player library, search, import -->
    <section class="panel panel-left" aria-label="Knihovna">
      <div class="library-tabs" role="tablist">
        <button id="tab-monsters" class="library-tab library-tab-active" type="button" role="tab" aria-selected="true">Monstra</button>
        <button id="tab-players" class="library-tab" type="button" role="tab" aria-selected="false">Hráči</button>
      </div>

      <div id="import-status" class="import-status" style="display:none"></div>

      <!-- Monster tab content -->
      <div id="monster-tab-content" class="library-tab-content">
        <div class="panel-header">
          <input
            id="monster-search"
            class="search-input"
            type="text"
            placeholder="Hledat podle jména, typu, CR, source..."
            autocomplete="off"
          />
          <button id="import-library-btn" class="btn btn-small" type="button">Import JSON</button>
          <input id="import-library-input" type="file" accept=".json,application/json" hidden />
        </div>
        <div id="monster-results" class="monster-results"></div>
      </div>

      <!-- Player tab content -->
      <div id="player-tab-content" class="library-tab-content" style="display:none">
        <div class="panel-header">
          <button id="add-all-players-btn" class="btn btn-small btn-primary" type="button">Add All Players</button>
          <a id="open-player-editor-btn" class="btn btn-small" href="player-editor.html" target="_blank" rel="noopener">Správa hráčů</a>
          <button id="reload-players-btn" class="btn btn-small" type="button" title="Znovu načíst hráče z localStorage">⟲ Reload Players</button>
        </div>
        <div id="player-results" class="monster-results"></div>
      </div>
    </section>

    <!-- REMINDERS PANEL: persistent short history (FIFO, capped at a few
         items) of condition-duration and concentration-check reminders.
         Replaces the old floating/auto-dismissing toast notifications --
         see js/toast.js for the ReminderToast module that manages this. -->
    <section class="panel panel-reminders" aria-label="Připomínky">
      <div class="panel-header panel-reminders-header">
        <h2>Připomínky</h2>
        <button id="clear-reminders-btn" class="btn btn-small" type="button" title="Smazat všechny připomínky"><img src="assets/icons/icon-remove.png" alt="" /> Smazat</button>
      </div>
      <div id="reminders-list" class="reminders-list">
        <p class="empty-hint">Žádné připomínky.</p>
      </div>
    </section>

    </div>

    <!-- MIDDLE PANEL: active encounter / turn order -->
    <section class="panel panel-middle" aria-label="Encounter">
      <div class="panel-header panel-header-encounter">
        <h2 id="round-counter">Kolo 1</h2>
        <div class="encounter-controls">
          <button id="prev-turn-btn" class="btn" type="button" title="Předchozí tah (B)"><img src="assets/icons/icon-previous-turn.png" alt="" /> Previous</button>
          <button id="next-turn-btn" class="btn btn-primary" type="button" title="Posune tah na dalšího v pořadí (N)">Next Turn <img src="assets/icons/icon-next-turn.png" alt="" /></button>
          <button id="next-round-btn" class="btn" type="button" title="Skočí na začátek pořadí a zvýší kolo">Next Round <img src="assets/icons/icon-next-round.png" alt="" /></button>
        </div>
      </div>

      <div class="panel-header panel-header-secondary">
        <button id="roll-initiative-btn" class="btn btn-small" type="button" title="Hází jen monstrům bez iniciativy. Hráči se nikdy nepřehazují."><img src="assets/icons/icon-d20.png" alt="" /> Roll Missing Initiative</button>
        <button id="group-selected-btn" class="btn btn-small" type="button" disabled>Group Selected</button>
        <span id="group-selection-hint" class="group-selection-hint">Vyber 2+ combatanty (checkbox nebo Ctrl/Shift+klik)</span>
        <button id="new-encounter-btn" class="btn btn-small btn-danger" type="button">New Encounter</button>
      </div>

      <div class="panel-header panel-header-secondary">
        <button id="export-encounter-btn" class="btn btn-small" type="button">Export Encounter</button>
        <button id="import-encounter-btn" class="btn btn-small" type="button">Import Encounter</button>
        <input id="import-encounter-input" type="file" accept=".json,application/json" hidden />
      </div>

      <div class="turn-list-header">
        <span class="turn-list-header-spacer"></span>
        <span>Init</span>
        <span>Typ</span>
        <span>Jméno</span>
        <span>AC</span>
        <span>HP</span>
        <span>Stav</span>
        <span class="turn-list-header-spacer"></span>
      </div>
      <div id="turn-list" class="turn-list"></div>
    </section>

    <!-- RIGHT PANEL: selected combatant detail -->
    <section class="panel panel-right" aria-label="Detail combatanta">
      <div id="detail-panel" class="detail-panel"></div>
    </section>

  </main>

  </div>

  <!-- Floating stat block popover (bullet F). Positioned dynamically near
       the clicked ⓘ icon by ui.js. Hidden by default. -->
  <div id="statblock-popover" class="statblock-popover" style="display:none" role="dialog" aria-label="Stat block">
  <div id="statblock-popover-header" class="statblock-popover-header panel-header">
      <span id="statblock-popover-title" class="statblock-popover-title"></span>
      <div class="statblock-popover-header-actions">
        <button id="statblock-pin-btn" class="btn btn-small panel-pin-btn" type="button" title="Připnout (nezavře se kliknutím mimo)">📌</button>
        <button id="statblock-close-btn" class="btn btn-small panel-close-btn" type="button" aria-label="Zavřít">&times;</button>
      </div>
    </div>
    <div id="statblock-popover-body" class="statblock-popover-body"></div>
  </div>

  <!-- Floating spell card (bullet C). Internal panel, not a new window.
       Positioned centrally by spell-ui.js. Hidden by default. -->
  <div id="spell-card" class="spell-card" style="display:none" role="dialog" aria-label="Spell card">
    <div id="spell-card-header" class="spell-card-header panel-header">
      <span id="spell-card-title" class="spell-card-title"></span>
      <div class="spell-card-header-actions">
        <button id="spell-card-pin-btn" class="btn btn-small panel-pin-btn" type="button" title="Připnout (nezavře se kliknutím mimo)">📌</button>
        <button id="spell-card-close-btn" class="btn btn-small panel-close-btn" type="button" aria-label="Zavřít">&times;</button>
      </div>
    </div>
    <div id="spell-card-body" class="spell-card-body"></div>
  </div>

  <!-- Floating Combat Log panel. Internal panel, not a new window.
       Positioned centrally by ui.js. Hidden by default. -->
  <div id="combat-log-panel" class="combat-log-panel" style="display:none" role="dialog" aria-label="Combat Log">
    <div id="combat-log-header" class="combat-log-header panel-header">
      <span class="combat-log-title">Combat Log</span>
      <div class="combat-log-header-actions">
        <button id="combat-log-export-btn" class="btn btn-small" type="button" title="Exportovat log do .txt souboru">⬇ Export TXT</button>
        <button id="combat-log-pin-btn" class="btn btn-small panel-pin-btn" type="button" title="Připnout (nezavře se kliknutím mimo)">📌</button>
        <button id="combat-log-close-btn" class="btn btn-small panel-close-btn" type="button" aria-label="Zavřít">&times;</button>
      </div>
    </div>
    <div id="combat-log-body" class="combat-log-body"></div>
  </div>

  <!-- Module scripts, loaded in dependency order. No bundler needed:
       each file defines a global (MonsterLibrary, PlayerLibrary, Encounter,
       Storage, UI, SpellLibrary, SpellUI) that the next file relies on. -->
  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/spell.js"></script>
  <script src="js/encounter.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/draggable-panel.js"></script>
  <script src="js/player-view-channel.js"></script>
  <script src="js/combat-log.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/spell-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
